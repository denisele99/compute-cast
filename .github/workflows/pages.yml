# Builds the frontend and publishes it to GitHub Pages on every push to main (or run it by hand).
# One-time setup: Settings > Pages > Source: "GitHub Actions", and Settings > Secrets and variables >
# Actions > Variables: VITE_API_BASE_URL = your Render URL (e.g. https://compute-cast-api.onrender.com).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the backend URL is set
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::Set the repository variable VITE_API_BASE_URL to your Render backend URL."; exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
